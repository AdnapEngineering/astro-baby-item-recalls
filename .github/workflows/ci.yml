name: Checks

on:
  pull_request:
  # Lets the deploy workflow run the same steps, so the two cannot drift apart.
  workflow_call:

permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # None of these steps touch Turso or need secrets, so they run on pull requests from
      # forks too. The accessibility checks build the site against a fixture database.
      - name: Formatting
        run: npm run format:check

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Install accessibility test browser
        run: npx playwright install --with-deps chromium

      - name: Accessibility checks with fixture data
        run: npm run test:a11y
