name: Ingest recalls

on:
  schedule:
    - cron: '0 12 * * 5' # weekly, Friday 12:00 UTC
  # Manual runs can widen the window — use this once to backfill history, then let the
  # schedule keep it current. Backfilling twice is harmless but pointless: rows upsert
  # on recallId, so a re-run just rewrites what is already there.
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days back to ingest'
        required: false
        default: '200'

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Upserts on recall_id, so re-running is safe and overlapping windows just refresh
      # rows rather than duplicating them.
      - name: Ingest CPSC recalls into Turso
        run: npm run ingest
        env:
          DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # Empty on scheduled runs, where the script's own 30-day default applies.
          INGEST_DAYS: ${{ inputs.days }}
