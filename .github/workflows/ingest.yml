name: Ingest recalls

on:
  schedule:
    - cron: '0 12 * * *' # daily, 12:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Upserts on recall_id, so re-running is safe and overlapping windows just refresh
      # rows rather than duplicating them.
      - name: Ingest CPSC recalls into Turso
        run: npm run ingest
        env:
          DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
